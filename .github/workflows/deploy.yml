name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

env:
  BUN_VERSION: "1.3.10"

jobs:
  check-status:
    name: Check Test Status
    runs-on: ubuntu-latest
    outputs:
      tests-passed: ${{ steps.check.outputs.tests-passed }}

    steps:
      - name: Check if tests passed
        id: check
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" == "success" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "tests-passed=true" >> $GITHUB_OUTPUT
          else
            echo "tests-passed=false" >> $GITHUB_OUTPUT
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: check-status
    if: needs.check-status.outputs.tests-passed == 'true'
    environment:
      name: staging
      url: https://staging-upshift.vercel.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Staging
        run: |
          npm install -g vercel
          vercel pull --yes --environment=preview
          vercel build --prod
          vercel deploy --prebuilt --prod --environment=preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Run smoke tests on staging
        run: |
          npx playwright test --grep "@smoke"
        env:
          BASE_URL: https://staging-upshift.vercel.app

      - name: Notify staging deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Staging deployment successful\n🔗 [View on Staging](https://staging-upshift.vercel.app)'
            })

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: success()
    environment:
      name: production
      url: https://upshiftlearning.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for production
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy to Vercel Production
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Run database migrations
        run: |
          bun run migrate:prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Warm up Supabase connection
        run: |
          curl -X POST https://api.supabase.co/auth/v1/token \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"grant_type": "password"}' || true

      - name: Run production smoke tests
        run: |
          npx playwright test --grep "@smoke"
        env:
          BASE_URL: https://upshiftlearning.org

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.run_number }}
          release_name: Production Release ${{ github.run_number }}
          body: |
            Production deployment successful
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚀 Production deployment successful",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Production Deployment"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*\n✅ Success"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment*\n🌐 Production"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*URL*\nhttps://upshiftlearning.org"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Sentry
        run: |
          curl -X POST "https://sentry.io/api/0/organizations/upshift-learning/releases/" \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "version": "release-${{ github.run_number }}",
              "ref": "${{ github.sha }}",
              "environment": "production"
            }'
        continue-on-error: true

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()

    steps:
      - name: Notify deployment failure
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ Production deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ Production deployment failed\nRolling back to previous version"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback to previous Vercel deployment
        run: |
          npm install -g vercel
          vercel rollback --yes --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Create GitHub Issue for manual review
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production deployment failed - run ${context.runNumber}`,
              body: `
                ❌ Production deployment failed and was automatically rolled back.

                **Commit:** ${context.sha}
                **Run:** ${context.runNumber}
                **Branch:** ${context.ref}

                **Action Required:**
                - Review the logs above
                - Fix the issue
                - Re-run the deployment

                [View Run](${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              `,
              labels: ['production', 'deployment', 'urgent']
            })
